name: validate

permissions:
  contents: read
  id-token: write

on:
  pull_request:

env:
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: corretto

jobs:
  login:
    name: Validate changes on branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          audience: sts.amazonaws.com
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::992382788472:role/nickheal-codeartifact-poc-reader

      - name: Get token
        run: |
          echo "CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain nickheal-poc --domain-owner 992382788472 --region eu-west-2 --query authorizationToken --output text)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Install dependencies from AWS CodeArtifact
        run: ./gradlew build

      - name: Run tests...
        run: ./gradlew test
